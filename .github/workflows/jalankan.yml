name: Scraping dan Export Otomatis

on:
  workflow_dispatch: # Tombol untuk menjalankan manual

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Izin agar bot bisa menyimpan file baru ke repo

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      # 1. JALANKAN SCRAPING (Mengisi Database)
      - name: Jalankan Scraping
        run: python deepseekposisi1.py
        
      # 2. JALANKAN EXPORT (Membuat File HTML dari Database)
      - name: Jalankan Export HTML
        run: python exportgeminictr.py
        
      # 3. SIMPAN HASILNYA KE GITHUB
      - name: Commit dan Push Perubahan
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Update otomatis dari GitHub Actions"
          git push
