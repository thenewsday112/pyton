name: Jalankan Script Python

on:
  workflow_dispatch: # Agar bisa dijalankan manual dari tab Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      # --- LANGKAH WAJIB: INSTAL LIBRARY ---
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      # --- JALANKAN SCRIPT ANDA ---
      - name: Jalankan Script Scraping
        run: python deepseekposisi1.py # <-- GANTI DENGAN NAMA FILE ANDA
        
      # --- LANGKAH WAJIB: SIMPAN HASIL KE REPO ---
      - name: Commit dan Push Perubahan
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Update otomatis dari GitHub Actions"
          git push
